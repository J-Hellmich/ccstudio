name: Build CCStudio Docker Image

permissions:
  actions: write
  contents: write
  issues: write
  packages: write
  pull-requests: write
  # This is used to complete the identity challenge
  # with sigstore/fulcio when running outside of PRs.
  id-token: write

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.vscode/*.json'
      - '.gitignore'
    branches:
      - '*'
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix_pre:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Generate a changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff
        with:
          config: .github/workflows/cliff.toml
          args: -vv --latest --no-exec --github-repo ${{ github.repository }}

  linux_docker:
    needs: matrix_pre
    runs-on: ubuntu-latest
    timeout-minutes: 600
    strategy:
      matrix:
        # run 3 ubuntu-latest jobs for building different CCStudio versions
        os: [20.04, 22.04, 24.04]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0
        set-safe-directory: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: whuzfb
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        echo "Replacing UBUNTU_VERSIONS with ${{ matrix.os }}"
        sed -Ei 's/^UBUNTU_VERSIONS[[:space:]]*:=[[:space:]]*.*/UBUNTU_VERSIONS := ${{ matrix.os }}/' Makefile
        sed -i 's|docker build|docker buildx build --sbom=true --provenance=mode=max --push -t ghcr.io/${{ github.repository }}:$(3)-ubuntu$(1)$(TAG_SUFFIX)|g' Makefile
        cat Makefile
        make all
        echo "Build docker image without mmWave SDK"
        sed -i 's|03.06.02.00-LTS||g' Makefile
        cat Makefile
        make all

    - name: Build latest image
      if: matrix.os == '24.04'
      run: |
        export latest_tag="20.2-ubuntu24.04-mmw"
        docker pull whuzfb/ccstudio:${latest_tag}
        docker tag whuzfb/ccstudio:${latest_tag} whuzfb/ccstudio:latest
        docker push whuzfb/ccstudio:latest
        docker pull ghcr.io/${{ github.repository }}:${latest_tag}
        docker tag ghcr.io/${{ github.repository }}:${latest_tag} ghcr.io/${{ github.repository }}:latest
        docker push ghcr.io/${{ github.repository }}:latest

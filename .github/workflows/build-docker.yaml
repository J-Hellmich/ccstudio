name: Build CCStudio Docker Image

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.vscode/*.json'
      - '.gitignore'
    branches:
      - '*'
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix_pre:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Generate a changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff
        with:
          config: .github/workflows/cliff.toml
          args: -vv --latest --no-exec --github-repo ${{ github.repository }}

  linux_docker:
    needs: matrix_pre
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0
        set-safe-directory: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: whuzfb
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # uses: docker/build-push-action@v6
    - name: Build and push Docker image
      run: |
        sed -i 's|docker build|docker buildx build --sbom=true --provenance=mode=max --push|g' Makefile
        make all
        echo "Build docker image without mmWave SDK"
        sed -i 's|03.06.02.00-LTS||g' Makefile
        make all

    - name: Build latest image
      run: |
        docker pull whuzfb/ccstudio:20.2-ubuntu24.04-mmw
        docker tag whuzfb/ccstudio:20.2-ubuntu24.04-mmw whuzfb/ccstudio:latest
        docker push whuzfb/ccstudio:latest